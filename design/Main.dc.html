<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FFB35C; } a:hover { color: #e09a45; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #0B1020; font-family: Rubik, system-ui, sans-serif; color: #F2EFEA;">

  <!-- Dusk sky: layered radial washes, no flat gradient bar -->
  <div style="position: absolute; inset: 0; background:
      radial-gradient(120% 62% at 78% 4%, #4A2A55 0%, rgba(74,42,85,0) 62%),
      radial-gradient(96% 46% at 16% 16%, #1E3A6B 0%, rgba(30,58,107,0) 68%),
      radial-gradient(150% 44% at 50% 40%, #C4633A 0%, rgba(196,99,58,0) 58%),
      #0B1020;"></div>

  <!-- Horizon line + water -->
  <div style="position: absolute; inset-inline: 0; top: 336px; height: 508px; background: linear-gradient(180deg, #10182E 0%, #080C18 100%);"></div>
  <div style="position: absolute; inset-inline: 0; top: 335px; height: 1px; background: linear-gradient(90deg, rgba(255,179,92,0) 0%, #FFB35C 50%, rgba(255,179,92,0) 100%); opacity: 0.75;"></div>

  <!-- Sun disc sitting on the horizon -->
  <div style="position: absolute; inset-inline-end: 58px; top: 258px; width: 154px; height: 154px; border-radius: 50%; background: radial-gradient(circle, #FFC876 0%, #E8763C 62%, rgba(232,118,60,0) 72%); opacity: 0.9;"></div>

  <!-- Header -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 24px 22px 0;">
    <span style="font-size: 15px; font-weight: 500; letter-spacing: 0.02em;">סנטוריני</span>
    <span style="font-size: 12px; font-weight: 300; color: rgba(242,239,234,0.6);">14 – 23 ביוני</span>
  </div>

  <!-- The countdown, weightless -->
  <div style="position: relative; padding: 74px 22px 0; text-align: center;">
    <div style="font-size: 132px; font-weight: 300; line-height: 0.82; letter-spacing: -0.05em; text-shadow: 0 0 46px rgba(255,179,92,0.45);">23</div>
    <div style="margin-top: 14px; font-size: 14px; font-weight: 300; letter-spacing: 0.32em; color: rgba(242,239,234,0.72);">י מ י ם   ל י צ י א ה</div>
  </div>

  <!-- Glass panel: tonight -->
  <div style="position: absolute; inset-inline: 22px; top: 396px; padding: 18px 18px 16px; border-radius: 22px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13); backdrop-filter: blur(18px);">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
      <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.14em; color: rgba(242,239,234,0.65);">ה ע ר ב</span>
      <span style="font-size: 12px; color: #FFB35C;">2 פריטים</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 13px;">
        <span style="font-size: 13px; font-weight: 500; color: #FFB35C; min-width: 42px;">18:40</span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 400;">שקיעה באואיה</span>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.1);"></div>
      <div style="display: flex; align-items: center; gap: 13px;">
        <span style="font-size: 13px; font-weight: 500; color: rgba(242,239,234,0.55); min-width: 42px;">20:15</span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 400;">ארוחת ערב · אמברוסיה</span>
      </div>
    </div>
  </div>

  <!-- Stat row -->
  <div style="position: absolute; inset-inline: 22px; top: 570px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <div style="padding: 13px 12px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 21px; font-weight: 400;">6</span>
      <span style="font-size: 11px; font-weight: 300; color: rgba(242,239,234,0.6);">משתתפים</span>
    </div>
    <div style="padding: 13px 12px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 21px; font-weight: 400;">9</span>
      <span style="font-size: 11px; font-weight: 300; color: rgba(242,239,234,0.6);">ימים</span>
    </div>
    <div style="padding: 13px 12px; border-radius: 18px; background: rgba(255,179,92,0.14); border: 1px solid rgba(255,179,92,0.32); display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 21px; font-weight: 400; color: #FFB35C;">4</span>
      <span style="font-size: 11px; font-weight: 300; color: rgba(255,179,92,0.8);">פתוחים</span>
    </div>
  </div>

  <!-- Agent -->
  <div style="position: absolute; inset-inline: 22px; top: 672px; display: flex; align-items: center; gap: 13px; padding: 15px 17px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFB35C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 14px; font-weight: 500;">שאל את הסוכן</span>
      <span style="font-size: 12px; font-weight: 300; color: rgba(242,239,234,0.55);">מה עושים עם בן 4 ביום גשום?</span>
    </div>
  </div>

  <!-- Nav: floating glass -->
  <div style="position: absolute; inset-inline: 16px; bottom: 18px; padding: 6px; border-radius: 26px; background: rgba(12,18,36,0.72); border: 1px solid rgba(255,255,255,0.11); backdrop-filter: blur(22px);">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px;">
      <div style="min-height: 48px; border-radius: 20px; background: rgba(255,179,92,0.16); display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 12px; font-weight: 500; color: #FFB35C;">בית</span>
      </div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(242,239,234,0.55);">מסלול</span></div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(242,239,234,0.55);">מומלצים</span></div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(242,239,234,0.55);">מסמכים</span></div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(242,239,234,0.55);">צ'קליסט</span></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
