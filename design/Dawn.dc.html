<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF8A6B; } a:hover { color: #e0755a; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #131A24; font-family: Assistant, system-ui, sans-serif; color: #DCE3EA;">

  <!-- Pre-dawn: cold, almost monochrome, one warm seam -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #1E2A38 0%, #182231 46%, #0F151D 100%);"></div>
  <div style="position: absolute; inset-inline: 0; top: 470px; height: 1px; background: linear-gradient(90deg, rgba(255,138,107,0) 0%, #FF8A6B 42%, rgba(255,138,107,0.25) 100%);"></div>
  <div style="position: absolute; inset-inline: 0; top: 471px; height: 90px; background: linear-gradient(180deg, rgba(255,138,107,0.11) 0%, rgba(255,138,107,0) 100%);"></div>

  <!-- Header -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 26px 24px 0;">
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.01em;">סנטוריני</span>
    <span style="font-size: 12px; font-weight: 200; color: rgba(220,227,234,0.45);">14 – 23 ביוני</span>
  </div>

  <!-- Countdown: flush start, not centred. Restraint is the idea. -->
  <div style="position: relative; padding: 96px 24px 0;">
    <div style="font-size: 116px; font-weight: 200; line-height: 0.8; letter-spacing: -0.055em;">23</div>
    <div style="margin-top: 18px; display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 13px; font-weight: 300; letter-spacing: 0.2em; color: rgba(220,227,234,0.62);">י מ י ם   ל י צ י א ה</span>
    </div>
    <div style="margin-top: 6px; font-size: 12px; font-weight: 200; color: rgba(220,227,234,0.38);">אייג'יאן A3 962 · נתב״ג 06:40</div>
  </div>

  <!-- Evening: hairline rows, no containers at all -->
  <div style="position: absolute; inset-inline: 24px; top: 512px;">
    <span style="font-size: 11px; font-weight: 300; letter-spacing: 0.18em; color: rgba(220,227,234,0.4);">ה ע ר ב</span>

    <div style="margin-top: 14px; display: flex; align-items: baseline; gap: 16px; padding-bottom: 13px; border-bottom: 1px solid rgba(220,227,234,0.11);">
      <span style="font-size: 13px; font-weight: 300; color: #FF8A6B; min-width: 40px;">18:40</span>
      <span style="flex-grow: 1; font-size: 16px; font-weight: 400;">שקיעה באואיה</span>
    </div>
    <div style="margin-top: 13px; display: flex; align-items: baseline; gap: 16px; padding-bottom: 13px; border-bottom: 1px solid rgba(220,227,234,0.11);">
      <span style="font-size: 13px; font-weight: 300; color: rgba(220,227,234,0.4); min-width: 40px;">20:15</span>
      <span style="flex-grow: 1; font-size: 16px; font-weight: 400; color: rgba(220,227,234,0.8);">ארוחת ערב · אמברוסיה</span>
    </div>
  </div>

  <!-- Stats: a single typographic line -->
  <div style="position: absolute; inset-inline: 24px; top: 652px; display: flex; align-items: baseline; gap: 22px;">
    <span style="font-size: 12px; font-weight: 200; color: rgba(220,227,234,0.5);"><strong style="font-size: 19px; font-weight: 300; color: #DCE3EA;">6</strong> משתתפים</span>
    <span style="font-size: 12px; font-weight: 200; color: rgba(220,227,234,0.5);"><strong style="font-size: 19px; font-weight: 300; color: #DCE3EA;">9</strong> ימים</span>
    <span style="font-size: 12px; font-weight: 200; color: rgba(255,138,107,0.75);"><strong style="font-size: 19px; font-weight: 300; color: #FF8A6B;">4</strong> פתוחים</span>
  </div>

  <!-- Agent -->
  <div style="position: absolute; inset-inline: 24px; top: 712px; display: flex; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid rgba(220,227,234,0.11);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 14px; font-weight: 600;">שאל את הסוכן</span>
      <span style="font-size: 12px; font-weight: 200; color: rgba(220,227,234,0.42);">מה כדאי להזמין מראש?</span>
    </div>
  </div>

  <!-- Nav: text only, one warm marker -->
  <div style="position: absolute; inset-inline: 0; bottom: 0; padding: 10px 14px 16px; border-top: 1px solid rgba(220,227,234,0.09);">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
      <div style="min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <span style="font-size: 12px; font-weight: 600; color: #FF8A6B;">בית</span>
        <span style="width: 14px; height: 1.5px; background: #FF8A6B;"></span>
      </div>
      <div style="min-height: 46px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(220,227,234,0.45);">מסלול</span></div>
      <div style="min-height: 46px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(220,227,234,0.45);">מומלצים</span></div>
      <div style="min-height: 46px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(220,227,234,0.45);">מסמכים</span></div>
      <div style="min-height: 46px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(220,227,234,0.45);">צ'קליסט</span></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
