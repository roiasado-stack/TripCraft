<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f6fb" />
    <!-- Home-screen install. iOS ignores the manifest's display mode and reads
         these instead; the title keeps the icon label short. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TripCraft" />
    <title>TripCraft - כל הטיול שלכם במקום אחד | בעברית, עם כשרות וסוכן AI</title>
    <meta name="description" content="מעלים הזמנה ומקבלים טיול שלם בעברית - מסלול, טיסות, מלון, כשרות, שבת וסוכן AI. גם לסוכני נסיעות." />
    <!-- Link-preview card of the public landing page. api/share-og strips these (and swaps in the
         trip's or agency's own) on /share pages, so nothing here reaches an agency's page. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="TripCraft" />
    <meta property="og:title" content="TripCraft - כל הטיול שלכם במקום אחד | בעברית, עם כשרות וסוכן AI" />
    <meta property="og:description" content="מעלים הזמנה ומקבלים טיול שלם בעברית - מסלול, טיסות, מלון, כשרות, שבת וסוכן AI. גם לסוכני נסיעות." />
    <meta property="og:image" content="https://tripcraft.co.il/og-rome.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="טיול של 3 ימים ברומא ב-TripCraft: טיסה, מלון, אטרקציות וארוחות כשרות" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TripCraft - כל הטיול שלכם במקום אחד | בעברית, עם כשרות וסוכן AI" />
    <meta name="twitter:description" content="מעלים הזמנה ומקבלים טיול שלם בעברית - מסלול, טיסות, מלון, כשרות, שבת וסוכן AI. גם לסוכני נסיעות." />
    <meta name="twitter:image" content="https://tripcraft.co.il/og-rome.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Rubik:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- No brand name here: api/share-og serves this file under an agency's own branding. -->
    <noscript>
      <p>אפליקציה בעברית לתכנון וניהול טיולים. כדי להשתמש בה יש להפעיל JavaScript.</p>
      <p><a href="/privacy">מדיניות פרטיות</a> · <a href="/terms">תנאי שימוש</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
