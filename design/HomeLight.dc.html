<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C2622A; } a:hover { color: #e09a45; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #FBF7F2; font-family: Rubik, system-ui, sans-serif; color: #171A21;">

  <!-- Midday sky: cool above, warm at the seam -->
  <div style="position: absolute; inset: 0; background:
      radial-gradient(120% 62% at 78% 2%, #CFE2F5 0%, rgba(207,226,245,0) 64%),
      radial-gradient(96% 46% at 14% 14%, #DCEAF7 0%, rgba(220,234,247,0) 70%),
      radial-gradient(150% 40% at 50% 38%, #FBE6CE 0%, rgba(251,230,206,0) 60%),
      #FBF7F2;"></div>

  <!-- Sea: cool enough that the horizon actually reads on paper -->
  <div style="position: absolute; inset-inline: 0; top: 336px; height: 508px; background: linear-gradient(180deg, #E4EDF6 0%, #EFF3F7 100%);"></div>
  <div style="position: absolute; inset-inline: 0; top: 335px; height: 1px; background: linear-gradient(90deg, rgba(194,98,42,0) 0%, #C2622A 50%, rgba(194,98,42,0) 100%); opacity: 0.55;"></div>

  <!-- Sun: pale, low, and behind the numeral rather than across it -->
  <div style="position: absolute; inset-inline-end: 64px; top: 288px; width: 108px; height: 108px; border-radius: 50%; background: radial-gradient(circle, rgba(255,199,133,0.85) 0%, rgba(240,168,104,0.42) 58%, rgba(240,168,104,0) 72%);"></div>

  <!-- Header -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 24px 22px 0;">
    <span style="font-size: 15px; font-weight: 500; letter-spacing: 0.02em;">סנטוריני</span>
    <span style="font-size: 12px; font-weight: 300; color: rgba(23,26,33,0.66);">14 – 23 ביוני</span>
  </div>

  <!-- The countdown, weightless -->
  <div style="position: relative; padding: 74px 22px 0; text-align: center;">
    <div style="font-size: 132px; font-weight: 300; line-height: 0.82; letter-spacing: -0.05em; text-shadow: none;">23</div>
    <div style="margin-top: 14px; font-size: 14px; font-weight: 300; letter-spacing: 0.32em; color: rgba(23,26,33,0.72);">י מ י ם   ל י צ י א ה</div>
  </div>

  <!-- Glass panel: tonight -->
  <div style="position: absolute; inset-inline: 22px; top: 396px; padding: 18px 18px 16px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(23,26,33,0.1); backdrop-filter: blur(18px);">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
      <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.14em; color: rgba(23,26,33,0.65);">ה ע ר ב</span>
      <span style="font-size: 12px; color: #C2622A;">2 פריטים</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 13px;">
        <span style="font-size: 13px; font-weight: 500; color: #C2622A; min-width: 42px;">18:40</span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 400;">שקיעה באואיה</span>
      </div>
      <div style="height: 1px; background: rgba(23,26,33,0.1);"></div>
      <div style="display: flex; align-items: center; gap: 13px;">
        <span style="font-size: 13px; font-weight: 500; color: rgba(23,26,33,0.63); min-width: 42px;">20:15</span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 400;">ארוחת ערב · אמברוסיה</span>
      </div>
    </div>
  </div>

  <!-- Stat row -->
  <div style="position: absolute; inset-inline: 22px; top: 570px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <div style="padding: 13px 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid rgba(23,26,33,0.1); display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 21px; font-weight: 400;">6</span>
      <span style="font-size: 11px; font-weight: 300; color: rgba(23,26,33,0.66);">משתתפים</span>
    </div>
    <div style="padding: 13px 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid rgba(23,26,33,0.1); display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 21px; font-weight: 400;">9</span>
      <span style="font-size: 11px; font-weight: 300; color: rgba(23,26,33,0.66);">ימים</span>
    </div>
    <div style="padding: 13px 12px; border-radius: 18px; background: rgba(194,98,42,0.14); border: 1px solid rgba(194,98,42,0.32); display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 21px; font-weight: 400; color: #C2622A;">4</span>
      <span style="font-size: 11px; font-weight: 300; color: rgba(194,98,42,0.8);">פתוחים</span>
    </div>
  </div>

  <!-- Agent -->
  <div style="position: absolute; inset-inline: 22px; top: 672px; display: flex; align-items: center; gap: 13px; padding: 15px 17px; border-radius: 20px; background: #FFFFFF; border: 1px solid rgba(23,26,33,0.1);">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C2622A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 14px; font-weight: 500;">שאל את הסוכן</span>
      <span style="font-size: 12px; font-weight: 300; color: rgba(23,26,33,0.63);">מה עושים עם בן 4 ביום גשום?</span>
    </div>
  </div>

  <!-- Nav: floating glass -->
  <div style="position: absolute; inset-inline: 16px; bottom: 18px; padding: 6px; border-radius: 26px; background: rgba(255,255,255,0.84); border: 1px solid rgba(23,26,33,0.08); backdrop-filter: blur(22px); box-shadow: 0 6px 22px -12px rgba(23,26,33,0.3);">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px;">
      <div style="min-height: 48px; border-radius: 20px; background: rgba(194,98,42,0.16); display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 12px; font-weight: 500; color: #C2622A;">בית</span>
      </div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(23,26,33,0.63);">מסלול</span></div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(23,26,33,0.63);">מומלצים</span></div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(23,26,33,0.63);">מסמכים</span></div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 300; color: rgba(23,26,33,0.63);">צ'קליסט</span></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
