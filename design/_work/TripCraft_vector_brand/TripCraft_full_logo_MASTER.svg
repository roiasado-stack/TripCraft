<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">TripCraft travel app logo</title>
<desc id="desc">Vector travel logo with map pin, mountains, route and airplane, TripCraft wordmark and slogan.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A3D91"/><stop offset=".55" stop-color="#0EA5FF"/><stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <linearGradient id="craft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0EA5FF"/><stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/>
  </filter>
</defs>

<!-- ICON -->
<g transform="translate(30 30)" filter="url(#shadow)">
  <rect x="0" y="0" width="460" height="460" rx="100" fill="url(#sky)"/>
  <circle cx="230" cy="210" r="125" fill="url(#sunset)" opacity=".98"/>
  <circle cx="230" cy="210" r="42" fill="#FFF4B0" opacity=".95"/>

  <!-- mountains -->
  <path d="M25 330 L120 215 L170 275 L245 150 L345 285 L405 225 L460 330 Z" fill="#0A3D91"/>
  <path d="M70 330 L120 245 L155 285 L245 175 L320 300 L345 270 L400 330 Z" fill="#174EA6"/>
  <path d="M110 330 L155 285 L175 310 L245 205 L290 330 Z" fill="#1E7BCB"/>

  <!-- water/route -->
  <path d="M185 460 C220 405 275 390 300 350 C322 315 286 298 258 288 C235 280 220 268 230 252
           C247 227 291 224 315 243 C350 271 356 310 339 342 C320 379 270 400 245 460 Z" fill="#E8FAFF"/>
  <path d="M210 460 C235 415 290 395 313 355 C331 323 308 303 280 294 C253 285 238 275 247 263
           C258 249 286 249 303 262 C325 279 330 306 317 331 C299 365 251 390 230 460 Z" fill="#38BDF8"/>

  <!-- trees -->
  <g fill="#0B6B3A">
    <path d="M35 345 l30-70 30 70z"/><path d="M70 350 l25-58 25 58z"/>
    <path d="M365 350 l28-66 28 66z"/><path d="M400 355 l23-55 23 55z"/>
  </g>

  <!-- route ring / pin -->
  <path d="M230 72 C145 72 92 136 92 215 C92 300 164 350 230 400 C296 350 368 300 368 215 C368 136 315 72 230 72 Z"
        fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round"/>
  <circle cx="230" cy="215" r="72" fill="#0A3D91" opacity=".9"/>
  <!-- compass needle -->
  <path d="M270 174 L244 234 L185 260 L211 200 Z" fill="#FFFFFF"/>
  <path d="M270 174 L244 234 L211 200 Z" fill="#F59E0B"/>

  <!-- airplane route -->
  <path d="M80 120 C130 75 185 62 235 83 C280 101 315 83 350 55" fill="none"
        stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 22"/>
  <path d="M345 48 l48 8 -36 30 8-20z" fill="#F59E0B"/>
</g>

<!-- WORDMARK -->
<g transform="translate(540 135)">
  <text x="0" y="150" font-family="Inter, Arial, Helvetica, sans-serif" font-size="150" font-weight="800" letter-spacing="-7" fill="#1E293B">Trip</text>
  <text x="365" y="150" font-family="Inter, Arial, Helvetica, sans-serif" font-size="150" font-weight="800" letter-spacing="-7" fill="url(#craft)">Craft</text>

  <!-- compass accent -->
  <g transform="translate(275 5)">
    <path d="M30 0 L58 14 L40 53 L12 38 Z" fill="#F59E0B"/>
    <path d="M30 0 L40 53 L12 38 Z" fill="#FFFFFF"/>
  </g>

  <!-- orange swoosh -->
  <path d="M10 185 C190 220 530 220 875 184 C720 228 300 250 10 185 Z" fill="#F59E0B"/>

  <text x="175" y="275" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="600"
        letter-spacing="14" fill="#1E293B">PLAN</text>
  <circle cx="315" cy="263" r="6" fill="#F59E0B"/>
  <text x="350" y="275" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="600"
        letter-spacing="14" fill="#1E293B">EXPLORE</text>
  <circle cx="620" cy="263" r="6" fill="#F59E0B"/>
  <text x="655" y="275" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="600"
        letter-spacing="14" fill="#1E293B">GO</text>
</g>
</svg>