<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Heebo:wght@300;400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #F5C518; } a:hover { color: #d4a912; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #0A0A0A; font-family: Heebo, system-ui, sans-serif; color: #F2F2F0;">

  <!-- No atmosphere. Just black, type, and one hot accent. -->

  <!-- Header rail -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0;">
    <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.2em; color: #6E6E6A;">ס נ ט ו ר י נ י</span>
    <span style="font-size: 11px; font-weight: 400; letter-spacing: 0.08em; color: #6E6E6A;">14 – 23.06</span>
  </div>

  <!-- Letterbox band with the headline number -->
  <div style="margin-top: 22px; border-top: 1px solid #262624; border-bottom: 1px solid #262624; background: #0F0F0E; padding: 30px 20px 26px;">
    <div style="display: flex; align-items: flex-end; gap: 12px;">
      <span style="font-family: Karantina, Impact, sans-serif; font-weight: 700; font-size: 150px; line-height: 0.62; letter-spacing: -0.03em; color: #F5C518;">23</span>
      <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 6px;">
        <span style="font-family: Karantina, Impact, sans-serif; font-weight: 700; font-size: 40px; line-height: 0.8;">ימים</span>
        <span style="font-size: 11px; font-weight: 400; letter-spacing: 0.14em; color: #6E6E6A;">ל י צ י א ה</span>
      </div>
    </div>
  </div>

  <!-- Film-strip rhythm: the evening as numbered frames -->
  <div style="padding: 24px 20px 0;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
      <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: #6E6E6A;">ה ע ר ב</span>
      <span style="font-family: Karantina, Impact, sans-serif; font-size: 20px; color: #F5C518;">02</span>
    </div>

    <div style="display: flex; gap: 14px; padding: 14px 0; border-top: 2px solid #F2F2F0;">
      <span style="font-family: Karantina, Impact, sans-serif; font-size: 30px; line-height: 0.8; color: #F5C518; min-width: 34px;">01</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 17px; font-weight: 700; line-height: 1.15;">שקיעה באואיה</span>
        <span style="font-size: 12px; font-weight: 300; color: #8A8A85;">18:40 · הכי צפוף בשעה הזו</span>
      </div>
    </div>

    <div style="display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid #262624;">
      <span style="font-family: Karantina, Impact, sans-serif; font-size: 30px; line-height: 0.8; color: #4A4A47; min-width: 34px;">02</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 17px; font-weight: 700; line-height: 1.15; color: #C8C8C4;">ארוחת ערב · אמברוסיה</span>
        <span style="font-size: 12px; font-weight: 300; color: #8A8A85;">20:15 · הוזמן מראש</span>
      </div>
    </div>
  </div>

  <!-- Credits block -->
  <div style="margin: 22px 20px 0; padding-top: 16px; border-top: 1px solid #262624; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: Karantina, Impact, sans-serif; font-size: 34px; line-height: 0.8;">6</span>
      <span style="font-size: 10px; font-weight: 400; letter-spacing: 0.12em; color: #6E6E6A;">משתתפים</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: Karantina, Impact, sans-serif; font-size: 34px; line-height: 0.8;">9</span>
      <span style="font-size: 10px; font-weight: 400; letter-spacing: 0.12em; color: #6E6E6A;">ימים</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: Karantina, Impact, sans-serif; font-size: 34px; line-height: 0.8; color: #F5C518;">4</span>
      <span style="font-size: 10px; font-weight: 400; letter-spacing: 0.12em; color: #F5C518;">פתוחים</span>
    </div>
  </div>

  <!-- Agent as a marquee bar -->
  <div style="position: absolute; inset-inline: 20px; bottom: 96px; display: flex; align-items: center; gap: 13px; padding: 15px 16px; background: #F5C518;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 14px; font-weight: 700; color: #0A0A0A;">שאל את הסוכן</span>
      <span style="font-size: 11px; font-weight: 400; color: rgba(10,10,10,0.7);">איפה אוכלים כשר בסביבת המלון?</span>
    </div>
  </div>

  <!-- Nav -->
  <div style="position: absolute; inset-inline: 0; bottom: 0; border-top: 1px solid #262624; background: #0A0A0A;">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
      <div style="min-height: 58px; display: flex; align-items: center; justify-content: center; border-top: 3px solid #F5C518; margin-top: -1px;">
        <span style="font-size: 12px; font-weight: 700; color: #F5C518;">בית</span>
      </div>
      <div style="min-height: 58px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 400; color: #6E6E6A;">מסלול</span></div>
      <div style="min-height: 58px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 400; color: #6E6E6A;">מומלצים</span></div>
      <div style="min-height: 58px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 400; color: #6E6E6A;">מסמכים</span></div>
      <div style="min-height: 58px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; font-weight: 400; color: #6E6E6A;">צ'קליסט</span></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
